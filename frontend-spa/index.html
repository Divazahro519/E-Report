<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report - Layanan Pengaduan Masyarakat</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-rose-50/40 text-slate-700 font-sans antialiased">

    <div id="app">
        <nav class="bg-white/70 backdrop-blur-md sticky top-0 z-50 shadow-xs border-b border-rose-100 px-6 py-4 flex justify-between items-center transition-all duration-300">
            <div class="flex items-center space-x-2.5">
                <span class="text-2xl filter drop-shadow-sm">🌸</span>
                <span class="text-xl font-black text-rose-500 tracking-wider">E-Report</span>
            </div>
            
            <div class="space-x-1.5 flex items-center text-sm">
                <router-link to="/" class="px-4 py-2 rounded-full text-slate-600 hover:text-rose-500 hover:bg-rose-50/50 font-semibold transition-all duration-200">Beranda</router-link>
                <router-link v-if="isLoggedIn" to="/dashboard" class="px-4 py-2 rounded-full text-slate-600 hover:text-rose-500 hover:bg-rose-50/50 font-semibold transition-all duration-200">Dashboard</router-link>
                
                <router-link v-if="!isLoggedIn" to="/login" class="bg-rose-400 hover:bg-rose-500 text-white px-5 py-2 rounded-full font-bold shadow-xs hover:shadow-md active:scale-95 transition-all duration-200 ml-2">Login</router-link>
                <button v-if="isLoggedIn" @click="handleLogout" class="bg-slate-400 hover:bg-slate-500 text-white px-5 py-2 rounded-full font-bold shadow-xs hover:shadow-md active:scale-95 transition-all duration-200 ml-2">Logout</button>
            </div>
        </nav>

        <main class="container mx-auto p-4 sm:p-6 min-h-[calc(100vh-73px)] flex flex-col justify-between">
            <router-view></router-view>
        </main>
    </div>

    <script src="components/Home.js"></script>
    <script src="components/Login.js"></script>
    <script src="components/Dashboard.js"></script>

    <script>
        const API_URL = 'http://localhost:8080/'; 

        // Axios Interceptors untuk Pengelolaan Token JWT/Session
        axios.interceptors.request.use(config => {
            const token = localStorage.getItem('token');
            if (token) { config.headers.Authorization = `Bearer ${token}`; }
            return config;
        }, error => Promise.reject(error));

        axios.interceptors.response.use(
            response => response,
            error => {
                if (error.response && error.response.status === 401) {
                    alert('Sesi Anda telah habis atau Anda tidak memiliki akses.');
                    localStorage.clear();
                    window.location.hash = '/login'; 
                }
                return Promise.reject(error);
            }
        );

        // Konfigurasi Vue Router
        const routes = [
            { path: '/', component: Home },
            { path: '/login', component: Login },
            { path: '/dashboard', component: Dashboard, meta: { requiresAuth: true } }
        ];

        const router = VueRouter.createRouter({
            history: VueRouter.createWebHashHistory(),
            routes
        });

        router.beforeEach((to, from, next) => {
            const loggedIn = localStorage.getItem('isLoggedIn') === 'true';
            if (to.meta.requiresAuth && !loggedIn) {
                next('/login'); 
            } else {
                next();
            }
        });

        // Inisialisasi Aplikasi Vue Core
        const app = Vue.createApp({
            data() { return { isLoggedIn: false } },
            methods: {
                checkLogin() { this.isLoggedIn = localStorage.getItem('isLoggedIn') === 'true'; },
                handleLogout() {
                    localStorage.clear();
                    this.checkLogin();
                    router.push('/');
                }
            },
            mounted() { this.checkLogin(); }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
